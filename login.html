<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login / Register | JB EDUCATION</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Gujarati","Nirmala UI",sans-serif;background:#f5f7fb;color:#172033}
header{background:linear-gradient(135deg,#071b43,#2563eb);color:#fff;padding:20px 16px}.wrap{max-width:900px;margin:auto;padding:0 16px}
.logo{display:inline-block;background:#fff;color:#173b8f;padding:10px 14px;border-radius:12px;font-weight:900;margin-right:10px}
h1{display:inline;font-size:22px}.box{background:#fff;margin:35px auto;padding:30px;border-radius:20px;box-shadow:0 8px 30px #17203318}
.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:700;margin:6px}
input{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #dbe3f0;border-radius:9px}
.notice{background:#eef5ff;padding:15px;border-radius:12px;margin:15px 0;line-height:1.6}
footer{text-align:center;background:#07152f;color:#cbd5e1;padding:25px;margin-top:50px}
</style>
</head><body>
<header><div class="wrap"><span class="logo">CCE</span><h1>JB EDUCATION</h1></div></header>
<main class="wrap"><div class="box">
<h2>👤 Login / Register</h2>
<p>વિદ્યાર્થી માટે Login અને Registration page.</p>
<form onsubmit="event.preventDefault(); alert('Login system પછી Firebase સાથે જોડાશે.');">
<label>Mobile / Email</label><input type="text" placeholder="તમારો Mobile અથવા Email">
<label>Password</label><input type="password" placeholder="Password">
<button class="btn" type="submit">Login</button>
<button class="btn" type="button" onclick="alert('Registration system Firebase સાથે જોડાશે.')">Register</button>
</form>
<p><a class="btn" href="index.html">🏠 Home પર પાછા જાઓ</a></p></div></main>
<footer>© 2026 JB Education • Online Exam Preparation</footer>
</body></html>

<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JB Education - Login</title><style>body{font-family:Arial,"Noto Sans Gujarati";background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:30px;border-radius:18px;box-shadow:0 10px 35px #0001;width:min(400px,90%)}input,button{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #ddd;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;font-weight:bold;cursor:pointer}.msg{margin-top:10px}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script></head>
<body><div class="card"><h2>👤 JB Education Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" class="msg"></p><a href="index.html">← Home</a></div>
<script>function login(){if(!firebaseReady)return msg.textContent="પહેલા Firebase config ભરો.";firebase.auth().signInWithEmailAndPassword(email.value,password.value).then(()=>location.href="index.html").catch(e=>msg.textContent=e.message)}</script></body></html>

 const q=questions[idx];
 document.getElementById('section').textContent=q.section;
 document.getElementById('count').textContent='પ્રશ્ન '+(idx+1)+' / '+questions.length;
 document.getElementById('bar').style.width=((idx+1)/questions.length*100)+'%';
 document.getElementById('question').innerHTML='<div class="card"><div class="qno">Question '+(idx+1)+'</div><div class="qtext">'+q.q+'</div>'+
 q.options.map((o,j)=>'<label class="opt"><input type="radio" name="answer" value="'+j+'" '+(answers[idx]===j?'checked':'')+' onchange="answers[idx]=+this.value"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'</div>';
}
function next(){if(idx<questions.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'})}}
function prev(){if(idx>0){idx--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function submitTest(){
 if(submitted)return;
 if(!confirm('શું તમે Test Submit કરવા માંગો છો?'))return;
 submitted=true; clearInterval(timerId);
 let correct=0,wrong=0,blank=0;
 questions.forEach((q,i)=>{if(answers[i]===null)blank++;else if(answers[i]===q.answer)correct++;else wrong++;});
 let score=correct-(wrong*0.25);
 const pct=(score/questions.length*100).toFixed(2);
 document.getElementById('test').style.display='none';document.getElementById('result').style.display='block';
 document.getElementById('score').textContent=document.getElementById('name').value+' — '+score.toFixed(2)+' / 150';
 document.getElementById('details').innerHTML='<table><tr><th>વિગત</th><th>પરિણામ</th></tr>'+
 '<tr><td>સાચા જવાબ</td><td>'+correct+'</td></tr><tr><td>ખોટા જવાબ</td><td>'+wrong+'</td></tr>'+
 '<tr><td>છોડેલા</td><td>'+blank+'</td></tr><tr><td>Percentage</td><td>'+pct+'%</td></tr>'+
 '<tr><td>Negative Marking</td><td>−'+(wrong*0.25).toFixed(2)+'</td></tr></table>';
 document.getElementById('timer').textContent='TEST OVER';

 const studentName=document.getElementById('name').value.trim();
 const resultData={
  studentName:studentName,
  testName:'CCE Mock Test 02',
  score:Number(score.toFixed(2)),
  correct:correct,
  wrong:wrong,
  unattempted:blank,
  percentage:Number(pct),
  negativeMarks:Number((wrong*0.25).toFixed(2)),
  submittedAt:firebase.firestore.FieldValue.serverTimestamp()
 };

 db.collection('results').add(resultData)
  .then(function(){
   document.getElementById('details').innerHTML +=
    '<p style="margin-top:16px;color:#15803d;font-weight:700">✅ Result online save થઈ ગયો.</p>';
  })
  .catch(function(error){
   console.error('Firebase save error:',error);
   document.getElementById('details').innerHTML +=
    '<p style="margin-top:16px;color:#b91c1c;font-weight:700">⚠️ Result online save થઈ શક્યો નથી. Firebase Rules ચેક કરો.</p>';
  });
}
</script>
</body></html>
